[project]
name = "chat-orchestrator-backend"
version = "0.2.0"
description = "Local sandbox workspace agent powered by OpenAI and Azure Responses API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "httpx>=0.28.1,<1",
  "socksio>=1.0.0,<2",
  "pydantic-settings>=2.6.1,<3",
  "openai>=2.26.0,<3",
  "python-dotenv>=1.0.1,<2",
  "pyyaml>=6.0.3,<7",
  "python-multipart>=0.0.18,<1",
]

[dependency-groups]
dev = ["pytest>=8.4.2,<9"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = ["docker: requires the built sandbox image and a running Docker daemon", "live: explicit paid API smoke test"]
