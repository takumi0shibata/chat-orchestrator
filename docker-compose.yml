# Only the sandbox image is built with Compose. FastAPI runs on the host and
# creates restricted per-run containers; never mount docker.sock into a sandbox.
services:
  sandbox:
    image: chat-orchestrator-sandbox:local
    build: ./sandbox
    profiles: [build]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
