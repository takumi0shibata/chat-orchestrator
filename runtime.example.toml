# Pre-downloaded NLP models and datasets; selected per run, mounted read-only.
# [[resources]]
# id = "models"
# label = "ローカルNLPモデル"
# path = "/absolute/path/to/models"

# Azure's deployed name is distinct from the underlying model ID.
# [[azure_models]]
# model = "gpt-5.6-sol"
# deployment = "my-sol-deployment"
# [[azure_models]]
# model = "gpt-5.6-terra"
# deployment = "my-terra-deployment"
# [[azure_models]]
# model = "gpt-5.6-luna"
# deployment = "my-luna-deployment"
# [[azure_models]]
# model = "gpt-6-astra"
# deployment = "my-astra-deployment"
# Deploy GPT-6 on Azure first, then add its actual deployment name below.
# [[azure_models]]
# model = "gpt-6-sol"
# deployment = "my-gpt-6-sol-deployment"
# [[azure_models]]
# model = "gpt-6-luna"
# deployment = "my-gpt-6-luna-deployment"
# Registered deployments appear in both chat and title model selectors.
# Existing Azure GPT-5.6 title model settings remain unchanged.

