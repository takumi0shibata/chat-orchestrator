[project]
name = "chat-workspace-sandbox"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "numpy", "pandas", "polars", "scipy", "torch", "scikit-learn", "matplotlib", "seaborn",
 "transformers", "datasets", "sentencepiece", "safetensors",
 "python-docx", "openpyxl", "python-pptx", "pypdf", "pdfplumber", "pymupdf",
 "pillow", "reportlab", "xlrd", "xlsxwriter", "beautifulsoup4", "lxml"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
